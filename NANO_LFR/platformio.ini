[platformio]
default_envs = nano_new
src_dir = .

[env]
platform = atmelavr
framework = arduino
monitor_speed = 9600
upload_port = /dev/ttyUSB0
monitor_port = /dev/ttyUSB0
monitor_filters = send_on_enter

; CH340 Nano clones usually require the Old Bootloader option.
[env:nano_old]
board = nanoatmega328

; Genuine/FTDI "new bootloader" Nano.
[env:nano_new]
board = nanoatmega328new
