[platformio]
default_envs = robot_s3
src_dir = .

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
upload_port = /dev/ttyUSB0
monitor_port = /dev/ttyUSB0
monitor_speed = 115200
build_src_filter = +<*> -<robot_s3/>
; MuseumProtocol.h and EspNowCompat.h are symlinked into this folder so the
; Arduino IDE finds them; this include path keeps the PlatformIO build working
; if those links are lost (e.g. after a zip export). Both resolve to
; firmware/common -- never copy them, the Hub must agree byte for byte.
build_flags =
  -I ../firmware/common
lib_deps =
  dfrobot/DFRobotDFPlayerMini @ ^1.0.6
  https://github.com/OSSLibraries/Arduino_MFRC522v2.git
  plerup/EspSoftwareSerial @ ^8.0.1

[env:robot_s3]
platform = espressif32 @ 6.12.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
build_src_filter = +<robot_s3/>
extra_scripts =
  pre:../firmware/NOV_HUB/tools/embed_ota_key.py
build_flags =
  -I ../firmware/common
  -I ../firmware/NOV_HUB/include
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_CDC_ON_BOOT=0
  -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
lib_deps =
  miguelbalboa/MFRC522 @ 1.4.12
  dfrobot/DFRobotDFPlayerMini @ 1.0.6
  h2zero/NimBLE-Arduino @ 1.4.3
