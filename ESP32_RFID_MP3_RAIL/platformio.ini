[platformio]
default_envs = esp32dev
src_dir = .

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
upload_port = /dev/ttyUSB0
monitor_port = /dev/ttyUSB0
monitor_speed = 115200
; MuseumProtocol.h and EspNowCompat.h are symlinked into this folder so the
; Arduino IDE finds them; this include path keeps the PlatformIO build working
; if those links are lost (e.g. after a zip export). Both resolve to
; firmware/common -- never copy them, the Hub must agree byte for byte.
build_flags =
  -I ../firmware/common
lib_deps =
  dfrobot/DFRobotDFPlayerMini @ ^1.0.6
  https://github.com/OSSLibraries/Arduino_MFRC522v2.git
  plerup/EspSoftwareSerial @ ^8.0.1
