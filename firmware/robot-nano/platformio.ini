[platformio]
default_envs = nano_new

[env]
platform = atmelavr
framework = arduino
monitor_speed = 115200
lib_deps =
  miguelbalboa/MFRC522@1.4.12
build_flags =
  -I ../common

[env:nano_new]
board = nanoatmega328new

; Select this environment when a common CH340 Nano clone only uploads with
; Arduino IDE's "ATmega328P (Old Bootloader)" processor option.
[env:nano_old]
board = nanoatmega328
