; =====================================================================
;  Hub (the Track ESP32) — PlatformIO project
;
;  Build & flash:        pio run -t upload
;  Serial monitor:       pio device monitor
;  Upload web files:     copy webapp/* into data/, then  pio run -t uploadfs
; =====================================================================
[platformio]
default_envs = hub

[env:hub]
platform      = espressif32          ; ESP32 Arduino core (2.x or 3.x both OK)
board         = esp32dev
framework     = arduino
monitor_speed = 115200
upload_speed  = 921600

; Serve the web app from flash (LittleFS). Web files live in data/.
board_build.filesystem = littlefs

; The shared ESP-NOW packet header lives in ../../common
build_flags =
  -I ../common

lib_deps =
  adafruit/Adafruit NeoPixel @ ^1.12.0
