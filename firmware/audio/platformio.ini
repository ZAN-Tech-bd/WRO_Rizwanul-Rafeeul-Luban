[platformio]
default_envs = audio

[env:audio]
; Pin to Arduino-ESP32 2.x (IDF 4.4). The latest 3.x core has a flash-size
; runtime probe regression ("Detected size(2k)") on CH340 clone ESP32 boards.
; 6.5.0 ships framework-arduinoespressif32 @ 2.0.17, which is known-good here
; and matches the platform the Hub originally booted on.
platform        = espressif32@6.5.0
board           = esp32dev
framework       = arduino
monitor_speed   = 115200
upload_speed    = 921600
board_build.flash_size = 4MB

lib_deps =
  dfrobot/DFRobotDFPlayerMini

build_flags =
  ; DFPlayer is wired to a hardware UART on ESP32:
  ;   ESP32 GPIO14 (TX) -> DFPlayer RX
  ;   ESP32 GPIO13 (RX) <- DFPlayer TX
  ;
  ; DO NOT use GPIO12 for TX: GPIO12 is the MTDI strapping pin that sets the
  ; internal flash voltage at boot. A HIGH on GPIO12 (e.g. DFPlayer RX pullup)
  ; forces 1.8V flash mode, which corrupts the 3.3V flash chip and crashes the
  ; ESP32 in a boot loop ("Detected size(2k) ... Probe failed").
  -D DF_TX_PIN=14
  -D DF_RX_PIN=13
