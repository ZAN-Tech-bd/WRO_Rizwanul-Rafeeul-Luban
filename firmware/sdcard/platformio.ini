; =====================================================================
;  SD card reader (ESP32) — PlatformIO project
;
;  Build & flash:    pio run -t upload
;  Serial monitor:   pio device monitor
;
;  The SD library ships with the ESP32 Arduino core (no lib_deps needed).
; =====================================================================
[platformio]
default_envs = sdcard

[env:sdcard]
platform      = espressif32          ; ESP32 Arduino core (2.x or 3.x both OK)
board         = esp32dev
framework     = arduino
monitor_speed = 115200
upload_speed  = 921600

build_flags =
  ; Include the shared config header from ./include
  -I include
