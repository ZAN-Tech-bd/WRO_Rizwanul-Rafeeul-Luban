[platformio]
default_envs = cam

; ===========================================================================
;  ESP32S-CAM (GC2145) camera node, on an ESP32-CAM-MB Type-C programmer.
;  - board = esp32cam : the AI-Thinker ESP32-CAM profile (PSRAM enabled), which
;    is what already worked for this GC2145 module in "ESP32 CAM.pdf".
;  - upload_speed = 115200 : the CAM-MB is flaky at 921600; 115200 is the
;    proven-reliable download speed for this carrier.
;  - huge_app.csv : 3 MB app / no SPIFFS partition (we store photos on the
;    onboard microSD, not in flash, so no LittleFS partition is needed).
; ===========================================================================
[env:cam]
platform      = espressif32
board         = esp32cam
framework     = arduino
monitor_speed = 115200
upload_speed  = 115200
board_build.partitions = huge_app.csv
build_flags   = -I ../common
monitor_filters = esp32_exception_decoder, time
