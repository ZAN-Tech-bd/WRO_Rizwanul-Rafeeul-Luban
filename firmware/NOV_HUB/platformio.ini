; =====================================================================
;  NOV_HUB — ESP32-S3 N16R8, six-station profile, embedded dashboard
;
;  Build & flash:        pio run -t upload
;  Serial monitor:       pio device monitor
;  Dashboard is embedded in the application; no separate uploadfs needed.
; =====================================================================
[platformio]
default_envs = NOV_HUB

[env:NOV_HUB]
platform      = espressif32 @ 6.12.0
board         = esp32-s3-devkitc-1
framework     = arduino
monitor_speed = 115200
upload_speed  = 921600
monitor_dtr = 0
monitor_rts = 0
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
extra_scripts =
  pre:tools/embed_dashboard.py
  pre:tools/embed_ota_key.py

; LittleFS is retained for photo storage; dashboard assets live in the app.
board_build.filesystem = littlefs

; The shared ESP-NOW packet header lives in ../../common
build_flags =
  -I ../common
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_CDC_ON_BOOT=0
  -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1

lib_deps =
  adafruit/Adafruit NeoPixel @ 1.15.5
  adafruit/DHT sensor library @ 1.4.6
  adafruit/Adafruit Unified Sensor @ 1.1.15
  h2zero/NimBLE-Arduino @ 1.4.3
