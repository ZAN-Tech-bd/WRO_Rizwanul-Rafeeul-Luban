; =====================================================================
;  Display — Robot Face & Info Screen on Arduino Mega 2560 + TFT shield
;
;  This is a DIFFERENT microcontroller family from the ESP32 nodes:
;  the Mega 2560 is an 8-bit AVR. It has no Wi-Fi and therefore cannot
;  join the ESP-NOW bus. Instead the ESP32 robot brain sends short text
;  commands over a UART wire; this Mega renders them on the TFT.
;
;  Shield: 3.2" / 3.5" MCUFRIEND parallel-bus TFT (ILI9481 16-bit),
;          plugs directly onto the Mega headers.
;
;  Build & flash:   cd firmware/display && pio run -t upload
;  Serial monitor:  pio device monitor   (USB @ 9600)
; =====================================================================
[platformio]
default_envs = display

[env:display]
platform    = atmelavr
board       = megaatmega2560
framework   = arduino
monitor_speed = 9600

; MCUFRIEND_kbv auto-detects the controller (ILI9481, ILI9341, etc.)
; and drives the 16-bit parallel bus through the Mega's port registers.
; Adafruit GFX provides the drawing primitives (circles, fills, text).
lib_deps =
  MCUFRIEND_kbv
  adafruit/Adafruit GFX Library

build_flags =
  ; MCUFRIEND 16-bit parallel Mega shield: activate the special pin map
  ; (pins 22-43) instead of the default Uno wiring. These two defines make
  ; the library include mcufriend_special.h -> USE_MEGA_16BIT_SHIELD block.
  -D USE_SPECIAL
  -D USE_MEGA_16BIT_SHIELD
  ; Force 480x320 so the geometry math is correct for the ILI9481 shield.
  -D MCUFRIEND_FORCE_480x320=1
