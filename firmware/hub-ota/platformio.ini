; =====================================================================
;  Hub (the Track ESP32) — BLE-OTA-enabled PlatformIO project
;
;  Flash it ONCE over USB, then reflash over Bluetooth LE forever after:
;
;    pio run -e hub -t upload        # USB (cable) — first time only
;    pio device monitor              # serial monitor (115200)
;
;  Later, cable-free updates over BLE (the laptop keeps its internet Wi-Fi):
;    python3 tools/ble_ota_upload.py .pio/build/hub/firmware.bin
;
;  Upload web files: copy webapp/* into data/, then  pio run -t uploadfs
; =====================================================================
[platformio]
default_envs = hub

; ---- settings shared by the USB and the OTA build ----
[hub_common]
platform      = espressif32          ; ESP32 Arduino core (2.x or 3.x both OK)
board         = esp32dev
framework     = arduino
monitor_speed = 115200
upload_speed  = 921600

; Serve the web app from flash (LittleFS). Web files live in data/.
board_build.filesystem = littlefs

; Tuned 4 MB OTA partition table: two 1.5 MiB app slots + 896 KiB LittleFS.
; The firmware (955,125 bytes) uses 60.7% of either app slot, while LittleFS
; has room for the 308,483-byte web bundle, upload scratch, and gallery fallback.
; See partitions.csv for the exact contiguous offsets.
; Switching layouts needs a ONE-TIME erase + USB reflash (see README.md).
board_build.partitions = partitions.csv

; The shared ESP-NOW packet header lives in ../../common
build_flags =
  -I ../common

lib_deps =
  adafruit/Adafruit NeoPixel @ ^1.12.0
  h2zero/NimBLE-Arduino @ ^1.4.2     ; BLE stack for the OTA GATT service

; =====================================================================
;  USB build (default). Build this for BOTH the first USB flash and the BLE
;  OTA firmware image (the BLE uploader pushes this same firmware.bin).
; =====================================================================
[env:hub]
extends = hub_common
