[platformio]
default_envs = robot

[env:robot]
; Pin the PlatformIO platform for a repeatable classic-ESP32 Arduino 2.x build
; and its channel-based LEDC API (ledcSetup/ledcAttachPin/ledcWrite).
; In the verified local package set, platform 6.5.0 resolves core 2.0.14.
platform        = espressif32@6.5.0
board           = esp32dev
framework       = arduino
monitor_speed   = 115200
upload_speed    = 921600
board_build.flash_size = 4MB

; The ESP32 is now the companion controller. The Nano owns line following,
; motors, and RC522; this target receives framed Nano events on GPIO25/26.
build_flags =
  -D CORE_DEBUG_LEVEL=0
  -I ../common
