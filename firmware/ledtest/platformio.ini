; =====================================================================
;  LED Test Bench — standalone WS2812B demo for the Hub's 74HCT125 chain
;
;  This is a SEPARATE project. It does NOT touch firmware/hub or any
;  other existing code. It only lights up the LED chain so you can
;  confirm the wiring through the 74HCT125 level shifter.
;
;  Build & flash:   pio run -t upload
;  Serial monitor:  pio device monitor
; =====================================================================
[platformio]
default_envs = ledtest

[env:ledtest]
platform      = espressif32          ; ESP32 Arduino core (2.x or 3.x both OK)
board         = esp32dev
framework     = arduino
monitor_speed = 115200
upload_speed  = 921600

; Same NeoPixel library the Hub uses, so the data timing is identical.
lib_deps =
  adafruit/Adafruit NeoPixel @ ^1.12.0
