; =====================================================================
;  Emergency-button bench test — YD-ESP32-S3 N16R8 on the Hub PCB
;
;  Build:   pio run -d firmware/tests/estop_button_test
;  Flash:   pio run -d firmware/tests/estop_button_test -t upload
;  Monitor: pio device monitor -d firmware/tests/estop_button_test
; =====================================================================
[platformio]
default_envs = estop_test

[env:estop_test]
platform      = espressif32
board         = esp32-s3-devkitc-1
framework     = arduino
monitor_speed = 115200
upload_speed  = 921600

; N16R8 = 16 MB quad flash + 8 MB octal PSRAM (matches the YD-ESP32-S3 board)
board_build.arduino.memory_type = qio_opi
board_upload.flash_size         = 16MB
board_build.partitions          = default_16MB.csv
