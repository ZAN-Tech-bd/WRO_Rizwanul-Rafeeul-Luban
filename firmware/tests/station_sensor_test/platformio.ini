; =====================================================================
;  Station DHT11 bench test — Hub PCB v0.4, YD-ESP32-S3 N16R8
;  DHT-only (S1 GPIO15 + S2 GPIO16) using the user-proven Adafruit DHT
;  library. MQ / PROX / LED tests were in the previous revision; see
;  README.md for their pin map if they are needed again.
;
;  Build & flash:  pio run -d firmware/tests/station_sensor_test -t upload
;  Monitor:        pio device monitor -d firmware/tests/station_sensor_test
; =====================================================================
[platformio]
default_envs = station_sensor_test

[env:station_sensor_test]
platform      = espressif32 @ 6.12.0
board         = esp32-s3-devkitc-1
framework     = arduino
board_build.arduino.memory_type = qio_opi
board_upload.flash_size         = 16MB
board_build.partitions          = default_16MB.csv
build_flags =
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_CDC_ON_BOOT=0
monitor_speed = 115200
monitor_dtr   = 0
monitor_rts   = 0
upload_speed  = 921600

lib_deps =
  adafruit/DHT sensor library @ ^1.4.6
  adafruit/Adafruit Unified Sensor @ ^1.1.14
