<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smart Museum — Check-in</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="name" data-i18n="appName">Smart Museum</span>
      <span class="tag" data-i18n="tagline">Robots Meet Culture</span>
    </div>
    <div id="langBox"></div>
  </header>

  <main>
    <section class="card gate-hero">
      <div class="big">🎟️</div>
      <h2 data-i18n="gateTitle">Visitor Check-in</h2>
      <p class="muted" data-i18n="gateHint">Scan the QR code at the gate to request entry.</p>

      <div class="scan-row" style="margin-top:16px;">
        <button class="block" onclick="document.getElementById('qrfile').click()" data-i18n="gateScan">Scan QR</button>
        <button class="secondary block" id="simBtn" data-i18n="gateSimulate">Simulate scan (demo)</button>
      </div>
      <input type="file" id="qrfile" accept="image/*" capture="environment" hidden />

      <div id="statusArea" style="margin-top:8px;"></div>
    </section>

    <p class="footer">WRO 2026 · Robots Meet Culture · Elementary</p>
  </main>

  <!-- offline QR decoder: download jsQR.js into js/vendor/ (see README). Missing = use Simulate. -->
  <script src="js/vendor/jsQR.js"></script>
  <script src="js/data.js"></script>
  <script src="js/hub.js"></script>
  <script src="js/qr.js"></script>
  <script>
    let myId = null;
    let polling = false;

    function setStatus(cls, text) {
      const area = document.getElementById("statusArea");
      area.innerHTML = "";
      if (cls === "waiting") {
        const spin = document.createElement("div"); spin.className = "spinner"; area.appendChild(spin);
      }
      const line = document.createElement("div");
      line.className = "status-line " + (cls === "waiting" ? "" : cls);
      line.textContent = text;
      area.appendChild(line);
    }

    async function beginCheckIn() {
      setStatus("waiting", t("gateWaiting"));
      myId = await Hub.requestCheckIn();   // POST /api/checkin on the Hub
      if (!polling) { polling = true; poll(); }
    }

    async function poll() {
      const r = await Hub.getRequest(myId);  // GET /api/request?id=...
      if (r && r.status === "approved") {
        setStatus("ok", t("gateApproved"));
        setTimeout(() => { window.location = "visitor.html?id=" + myId; }, 800);
        return;
      }
      if (r && r.status === "denied") {
        setStatus("bad", t("gateDenied"));
        polling = false;
        return;
      }
      setTimeout(poll, 800);
    }

    // real QR scan: visitor snaps/takes a photo of the gate QR code
    document.getElementById("qrfile").addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (!file) return;
      if (!Qr.available()) { beginCheckIn(); return; } // no library -> behave like simulate
      Qr.decodeFile(file, (text) => {
        if (text) beginCheckIn();
        else setStatus("bad", getLang() === "bn" ? "পড়া যায়নি, আবার চেষ্টা করুন বা Simulate ব্যবহার করুন।" : "Couldn't read it — try again or use Simulate.");
      });
      e.target.value = ""; // allow re-scanning the same file
    });

    // simulate (demo / no camera)
    document.getElementById("simBtn").addEventListener("click", () => {
      Qr.simulate();
      beginCheckIn();
    });

    document.addEventListener("DOMContentLoaded", () => {
      mountLangToggle("langBox");
      applyLang();

      // Native-camera scan path: /api/enter created the request and redirected
      // here with ?autoid=<id>. Skip the scan, go straight to waiting + polling.
      const autoId = new URLSearchParams(location.search).get("autoid");
      if (autoId) {
        myId = autoId;
        setStatus("waiting", t("gateWaiting"));
        polling = true;
        poll();
      }
    });
  </script>
</body>
</html>
