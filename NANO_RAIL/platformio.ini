[platformio]
default_envs = nano
src_dir = .

; Arduino Nano, ATmega328P, NEW bootloader (this board is new-bootloader).
[env:nano]
platform = atmelavr
framework = arduino
board = nanoatmega328new
monitor_speed = 9600
upload_port = /dev/ttyUSB0
monitor_port = /dev/ttyUSB0
monitor_filters = send_on_enter
