; Standalone RFID UID reader with a SoftAP web log.
; Independent of the museum-guide firmware in ESP32_RFID_MP3_LFR -- no
; DFPlayer, no Nano link, no ESP-NOW. Its AP is "ESP32-RFID", distinct from
; the robot's "ESP32-MP3", so both can run without colliding.

[platformio]
default_envs = esp32dev
src_dir = .

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
  https://github.com/OSSLibraries/Arduino_MFRC522v2.git
